server:
  port: 5080
  address: 127.0.0.1
  tomcat:
    max-swallow-size: 260MB
spring:
  datasource:
    url: jdbc:mysql://${INTEGRY_DB_HOST:127.0.0.1}:${INTEGRY_DB_PORT:3306}/${INTEGRY_DB_NAME:integry_dt}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: ${INTEGRY_DB_USER:integry_dev}
    password: ${INTEGRY_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc.time_zone: UTC
  servlet:
    multipart:
      max-file-size: 250MB
      max-request-size: 250MB
integry:
  jwt:
    signing-key: ${INTEGRY_JWT_SIGNING_KEY}
    issuer: ${INTEGRY_JWT_ISSUER:IntegryDT}
    audience: ${INTEGRY_JWT_AUDIENCE:IntegryDT.Clients}
    expiration-minutes: ${INTEGRY_JWT_EXPIRATION_MINUTES:60}
  client:
    enrollment-key: ${INTEGRY_CLIENT_ENROLLMENT_KEY}
  gadget-storage: ${INTEGRY_GADGET_STORAGE:C:\ProgramData\IntegryDT\GadgetStorage}
  artifact-storage: ${INTEGRY_ARTIFACT_STORAGE:C:\ProgramData\IntegryDT\ArtifactStorage}
  artifact-retention-days: ${INTEGRY_ARTIFACT_RETENTION_DAYS:7}
logging:
  level:
    org.springframework.security: INFO
